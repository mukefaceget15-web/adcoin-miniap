<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f5f0;color:#183329;font-family:Tahoma,Arial,sans-serif;font-size:14px}
header{background:#10271f;color:white;padding:20px 16px;border-radius:0 0 22px 22px}

.badge{display:inline-block;background:#fff1d4;color:#93620c;padding:5px 8px;border-radius:20px;font-size:11px}
.wallet{direction:ltr;text-align:left;background:#f3f7f1;padding:9px;border-radius:8px;font-size:11px;word-break:break-all}

<body>
<header>
  <h2>🛠 پنل مدیریت</h2>
  <p>NOT REWARD · مدیریت کاربران و برداشت‌ها</p>
  <p id="identity" style="margin-top:8px">در حال بررسی دسترسی...</p>
</header>
<main>
<nav>
  <button class="active" data-tab="dashboard">آمار</button>
  <button data-tab="withdrawals">برداشت‌ها</button>
  <button data-tab="users">کاربران</button>
</nav>

<section id="dashboard" class="panel active">
  <div class="grid" id="stats">
    <div class="empty">در حال دریافت آمار...</div>
  </div>
  <h3>درخواست‌های در انتظار</h3>
  <div id="pending"></div>
</section>

<section id="withdrawals" class="panel">
  <select id="wstatus">
    <option value="pending">در انتظار بررسی</option>
    <option value="approved">تأییدشده</option>
    <option value="paid">پرداخت‌شده</option>
    <option value="rejected">ردشده</option>
    <option value="all">همه درخواست‌ها</option>
  </select>
  <input id="wsearch" placeholder="جست‌وجوی شناسه، نام یا کیف پول">
  <div id="wlist"></div>
</section>

<section id="users" class="panel">
  <input id="usearch" placeholder="جست‌وجوی شناسه تلگرام یا نام کاربری">
  <select id="usort">
    <option value="new">جدیدترین کاربران</option>
    <option value="balance">بیشترین موجودی</option>
  </select>
  <div id="ulist"></div>
</section>

<div id="msg" role="status"></div>
</main>

<script>
"use strict";
const API="https://not-reward-api.mukefaceget15.workers.dev";
const tg=window.Telegram?.WebApp;
const initData=tg?.initData||"";
const $=id=>document.getElementById(id);
let stats=null, users=[], withdrawals=[];

tg?.ready();
tg?.expand();

function message(s){
  $("msg").textContent=s;
  $("msg").style.display="block";
}
function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function fmt(n){
  return Number(n||0).toLocaleString("fa-IR",{maximumFractionDigits:2});
}
async function api(path,body={}){
  if(!initData) throw Error("پنل را از داخل مینی‌اپ تلگرام باز کن.");
  let r;
  try{
    r=await fetch(API+path,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "X-Telegram-Init-Data":initData
      },
      body:JSON.stringify({...body,initData}),
      cache:"no-store"
    });
  }catch(e){throw Error("ارتباط با سرور برقرار نشد؛ اتصال و تنظیمات CORS را بررسی کن.");}
  const d=await r.json().catch(()=>({}));
  if(!r.ok||d.ok===false)throw Error(d.error||"خطای سرور: "+r.status);
  return d;
}
function tab(name){
  document.querySelectorAll(".panel").forEach(x=>x.classList.toggle("active",x.id===name));
  document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x.dataset.tab===name));
  if(name==="dashboard")loadStats();
  if(name==="withdrawals")loadWithdrawals();
  if(name==="users")loadUsers();
}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>tab(b.dataset.tab));

async function loadStats(){
  try{
    const d=await api("/api/admin/stats");
    stats=d.stats;
    const w=stats.withdrawals;
    $("stats").innerHTML=[
      ["کل کاربران",stats.users],
      ["کاربران جدید امروز",stats.newToday],
      ["مجموع موجودی",fmt(stats.totalBalance)+" NOT"],
      ["دعوت‌های موفق",stats.referrals],
      ["برداشت‌های در انتظار",w.pending.count],
      ["مبلغ در انتظار",fmt(w.pending.amount)+" NOT"],
      ["برداشت‌های پرداخت‌شده",w.paid.count],
      ["پاداش تبلیغ",fmt(stats.ads.total)+" NOT"]
    ].map(([a,b])=>`<div class="card stat"><small>${a}</small><strong>${b}</strong></div>`).join("");
    $("pending").innerHTML=`<div class="item">در انتظار بررسی: <b>${fmt(w.pending.count)}</b> درخواست · ${fmt(w.pending.amount)} NOT
      <div class="actions"><button onclick="tab('withdrawals')">مدیریت برداشت‌ها</button></div></div>`;
  }catch(e){message(e.message);}
}

async function loadWithdrawals(){
  $("wlist").innerHTML='<div class="empty">در حال دریافت...</div>';
  try{
    const d=await api("/api/admin/withdrawals",{
      status:$("wstatus").value,
      search:$("wsearch").value.trim(),
      limit:100,offset:0
    });
    withdrawals=d.items||[];
    $("wlist").innerHTML=withdrawals.length?withdrawals.map(w=>`
      <article class="item">
        <div class="row"><b>درخواست #${esc(w.id)}</b><strong>${fmt(w.amount)} NOT</strong></div>
        <div>کاربر: ${esc(w.first_name||"بدون نام")} ${w.username?"(@"+esc(w.username)+")":""}</div>
        <p class="muted">شناسه تلگرام: ${esc(w.user_id)}</p>
        <p><span class="badge">${esc(w.status)}</span> · ${esc(w.created_at||"")}</p>
        <div class="wallet">${esc(w.wallet_address)}</div>
        <div class="actions">
          <button class="gray" onclick="copyValue('${esc(w.wallet_address)}')">کپی کیف پول</button>
          <button class="blue" onclick="userDetail('${esc(w.user_id)}')">اطلاعات کاربر</button>
        </div>
        ${w.status==="pending"?`<div class="actions">
          <button onclick="withdrawAction(${Number(w.id)},'approve')">تأیید</button>
          <button onclick="withdrawAction(${Number(w.id)},'pay')">ثبت پرداخت</button>
          <button class="red" onclick="withdrawAction(${Number(w.id)},'reject')">رد و بازگشت وجه</button>
        </div>`:""}
        ${w.status==="approved"?`<div class="actions">
          <button onclick="withdrawAction(${Number(w.id)},'pay')">ثبت پرداخت</button>
          <button class="red" onclick="withdrawAction(${Number(w.id)},'reject')">رد و بازگشت وجه</button>
        </div>`:""}
      </article>`).join(""):'<div class="empty">درخواستی پیدا نشد.</div>';
  }catch(e){$("wlist").innerHTML="";message(e.message);}
}
async function withdrawAction(id,action){
  let note="",txHash="";
  if(action==="reject"){
    note=prompt("دلیل رد درخواست را وارد کن:");
    if(!note?.trim())return;
  }else{
    note=prompt("یادداشت اختیاری:")||"";
  }
  if(action==="pay")txHash=prompt("هش تراکنش (اختیاری):")||"";
  const labels={approve:"تأیید این درخواست؟",pay:"پرداخت این درخواست ثبت شود؟",reject:"درخواست رد و مبلغ به کاربر بازگردانده شود؟"};
  if(!confirm(labels[action]))return;
  try{
    const d=await api("/api/admin/withdrawal/update",{id,action,note,txHash,notify:true});
    message(d.notified?"عملیات ثبت شد و پیام ارسال شد.":"عملیات ثبت شد.");
    await loadWithdrawals();
    await loadStats();
  }catch(e){message(e.message);}
}
async function loadUsers(){
  $("ulist").innerHTML='<div class="empty">در حال دریافت...</div>';
  try{
    const d=await api("/api/admin/users",{
      search:$("usearch").value.trim(),
      sort:$("usort").value,limit:100,offset:0
    });
    users=d.items||[];
    $("ulist").innerHTML=users.length?users.map(u=>`
      <article class="item">
        <div class="row"><b>${esc(u.first_name||"بدون نام")}</b><strong>${fmt(u.balance)} NOT</strong></div>
        <div class="muted">${u.username?"@"+esc(u.username)+" · ":""}شناسه: ${esc(u.id)}</div>
        <p class="muted">دعوت‌ها: ${fmt(u.referrals)} · برداشت‌ها: ${fmt(u.withdrawals_count)}</p>
        <div class="actions">
          <button class="blue" onclick="userDetail('${esc(u.id)}')">جزئیات</button>
          <button class="red" onclick="toggleBlock('${esc(u.id)}',false)">مسدودسازی</button>
          <button class="gray" onclick="toggleBlock('${esc(u.id)}',true)">رفع مسدودی</button>
        </div>
      </article>`).join(""):'<div class="empty">کاربری پیدا نشد.</div>';
  }catch(e){$("ulist").innerHTML="";message(e.message);}
}
async function userDetail(userId){
  try{
    const d=await api("/api/admin/user/detail",{userId});
    const u=d.user;
    const history=(d.history||[]).map(h=>
      `<div class="row"><span>${esc(h.details||h.kind)}<small class="muted"><br>${esc(h.created_at||"")}</small></span><b>${fmt(h.amount)} NOT</b></div>`
    ).join("")||"تراکنشی ثبت نشده";
    alert(
      "اطلاعات کاربر\n"+
      "نام: "+(u.first_name||"—")+"\n"+
      "شناسه: "+u.id+"\n"+
      "یوزرنیم: "+(u.username||"—")+"\n"+
      "موجودی: "+fmt(u.balance)+" NOT\n"+
      "دعوت‌ها: "+fmt(d.referrals)+"\n"+
      "عضویت: "+(u.created_at||"—")+"\n\n"+
      "برای تاریخچه کامل از پاسخ API استفاده کن."
    );
    console.log("جزئیات کاربر",d);
  }catch(e){message(e.message);}
}
async function toggleBlock(userId,unblock){
  const action=unblock?"رفع مسدودی":"مسدودسازی";
  if(!confirm(`${action} کاربر ${userId}؟`))return;
  try{
    await api("/api/admin/user/block",{userId,blocked:!unblock});
    message(unblock?"مسدودی کاربر برداشته شد.":"کاربر مسدود شد.");
    await loadUsers();
  }catch(e){
    message(e.message);
    if(e.message.includes("مسیر مدیریت پیدا نشد")){
      message("قابلیت مسدودسازی هنوز به Worker اضافه نشده است؛ تا زمان افزودن مسیر امنیتی، این دکمه عمل نمی‌کند.");
    }
  }
}
async function copyValue(value){
  try{await navigator.clipboard.writeText(value);message("کپی شد.");}
  catch(e){prompt("آدرس را کپی کن:",value);}
}
$("wstatus").onchange=loadWithdrawals;
$("wsearch").oninput=()=>{clearTimeout(window.wsTimer);window.wsTimer=setTimeout(loadWithdrawals,350)};
$("usearch").oninput=()=>{clearTimeout(window.usTimer);window.usTimer=setTimeout(loadUsers,350)};
$("usort").onchange=loadUsers;

(async()=>{
  if(!initData){
    $("identity").textContent="از داخل مینی‌اپ تلگرام وارد شو.";
    $("stats").innerHTML='<div class="empty">این پنل فقط داخل تلگرام قابل استفاده است.</div>';
    return;
  }
  const u=tg?.initDataUnsafe?.user;
  if(u)$("identity").textContent=(u.first_name||"مدیر")+" · شناسه "+u.id;
  await loadStats();
})();
</script>
</body>
</html>
