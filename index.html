
<script>
(() => {
"use strict";

const API_BASE = "https://not-reward-api.mukefaceget15.workers.dev";
const AD_URL = "";
const BOT_USERNAME = "notrewarddbot";
const STORAGE_KEY = "not_reward_demo_v1";
const $ = id => document.getElementById(id);

let language = "fa";
let walletUI = null;
let connectedWallet = null;
let telegramUser = null;
let tapping = false;
let serverReady = false;

function readState() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch {
    return {};
  }
}

let state = Object.assign({
  balance: 0,
  taps: 0,
  streak: 1,
  lastDaily: "",
  lastTapReset: 0
}, readState());

state.balance = 0;
state.taps = Math.max(0, Number(state.taps) || 0);
state.streak = Math.min(7, Math.max(1, Number(state.streak) || 1));

function saveLocalDisplayState() {
  // Only saves display information. The server owns the real balance.
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      taps: state.taps,
      streak: state.streak,
      lastDaily: state.lastDaily,
      lastTapReset: state.lastTapReset
    }));
  } catch {}
}

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}

function dayOffset(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}

function setBalance(value) {
  const n = Number(value);
  if (!Number.isFinite(n) || n < 0) return;
  state.balance = n;
  renderBalance();
}

function renderBalance() {
  const value = Number(state.balance).toFixed(2);
  $("balance").textContent = value;
  $("withdrawBalance").textContent = value;
  $("profileBalance").textContent = value;
}

function renderRewardDays() {
  const box = $("rewardDays");
  box.innerHTML = "";

  for (let i = 1; i <= 7; i++) {
    const item = document.createElement("div");
    item.className = "day" +
      (i === state.streak ? " current" : "") +
      (state.lastDaily === today() && i <= state.streak ? " claimed" : "");

    const label = document.createElement("div");
    label.className = "day-number";
    label.textContent = language === "fa" ? `روز ${i}` : `Day ${i}`;

    const reward = document.createElement("div");
    reward.className = "day-reward";
    reward.textContent = `${i} NOT`;

    item.append(label, reward);
    box.appendChild(item);
  }
}

function render() {
  renderBalance();

  $("tapCount").textContent = state.taps;
  $("tapMini").textContent = state.taps;
  $("profileTaps").textContent = state.taps;
  $("streak").textContent = state.streak;
  $("dailyMini").textContent = state.streak;

  $("tapProgress").style.width =
    `${Math.min(100, state.taps / 5)}%`;

  $("dailyBtn").disabled =
    !serverReady || state.lastDaily === today();

  $("dailyBtn").textContent =
    state.lastDaily === today()
      ? (language === "fa"
          ? "پاداش امروز دریافت شده ✓"
          : "Today's reward claimed ✓")
      : (language === "fa"
          ? `دریافت ${state.streak} NOT`
          : `Claim ${state.streak} NOT`);

  $("robot").disabled = !serverReady || state.taps >= 500;

  renderRewardDays();
}

function showPage(page, button) {
  document.querySelectorAll(".page").forEach(p =>
    p.classList.remove("active")
  );
  $(page).classList.add("active");

  document.querySelectorAll(".nav-btn").forEach(b =>
    b.classList.remove("active")
  );
  if (button) button.classList.add("active");

  window.scrollTo({ top: 0, behavior: "smooth" });
}
window.showPage = showPage;

async function apiRequest(path, body = {}) {
  const initData = window.Telegram?.WebApp?.initData;

  if (!initData) {
    throw new Error(language === "fa"
      ? "این عملیات باید از داخل مینی‌اپ تلگرام انجام شود."
      : "Open this mini app inside Telegram to continue.");
  }

  const response = await fetch(`${API_BASE}${path}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...body, initData })
  });

  const result = await response.json().catch(() => ({}));

  if (!response.ok || !result.ok) {
    throw new Error(result.error ||
      (language === "fa" ? "درخواست ناموفق بود." : "Request failed."));
  }

  return result;
}

async function syncAccount() {
  if (!window.Telegram?.WebApp?.initData) {
    serverReady = false;
    $("tapMessage").textContent = language === "fa"
      ? "برای دریافت پاداش، این برنامه را از داخل تلگرام باز کن."
      : "Open this mini app inside Telegram to earn rewards.";
    $("lockMessage").textContent = "";
    render();
    return;
  }

  try {
    const result = await apiRequest("/api/me", {});
    setBalance(result.balance);
    serverReady = true;

    $("tapMessage").textContent = language === "fa"
      ? "هر لمس موفق، ۰٫۰۲ NOT به موجودی سرور اضافه می‌کند."
      : "Each successful tap adds 0.02 NOT to your server balance.";

    $("lockMessage").textContent = "";
    render();
  } catch (error) {
    serverReady = false;
    $("tapMessage").textContent = language === "fa"
      ? "اتصال حساب ناموفق بود. برنامه را از داخل تلگرام دوباره باز کن."
      : "Account sync failed. Reopen the app inside Telegram.";

    $("lockMessage").textContent = error.message;
    render();
  }
}

$("robot").addEventListener("click", async () => {
  if (tapping || !serverReady || state.taps >= 500) return;

  tapping = true;
  $("robot").disabled = true;

  try {
    const result = await apiRequest("/api/tap", {});

    if (typeof result.balance === "number") {
      setBalance(result.balance);
    }

    if (typeof result.tapsRemaining === "number") {
      state.taps = 500 - result.tapsRemaining;
    } else {
      state.taps = Math.min(500, state.taps + 1);
    }

    saveLocalDisplayState();
    render();

    $("tapMessage").textContent = language === "fa"
      ? `۰٫۰۲ NOT به موجودی سرور اضافه شد.`
      : "0.02 NOT added to your server balance.";

    if (state.taps >= 500) {
      $("lockMessage").textContent = language === "fa"
        ? "سهمیه لمس امروز تمام شد."
        : "Today's tap limit has been reached.";
    }
  } catch (error) {
    $("tapMessage").textContent = error.message;
    if (/سقف لمس|tap limit/i.test(error.message)) {
      state.taps = 500;
      render();
    }
  } finally {
    tapping = false;
    $("robot").disabled = !serverReady || state.taps >= 500;
  }
});

async function claimDaily() {
  if (!serverReady) {
    alert(language === "fa"
      ? "ابتدا حساب را از سرور همگام‌سازی کن."
      : "Sync your account with the server first.");
    return;
  }

  $("dailyBtn").disabled = true;

  try {
    const result = await apiRequest("/api/daily", {});

    if (typeof result.balance === "number") {
      setBalance(result.balance);
    }

    state.streak = Number(result.streak) || 1;
    state.lastDaily = today();
    saveLocalDisplayState();
    render();

    alert(language === "fa"
      ? `پاداش ${result.reward} NOT با موفقیت ثبت شد.`
      : `${result.reward} NOT reward successfully claimed.`);
  } catch (error) {
    alert(error.message);

    // A claim may already exist on the server even if local storage is stale.
    if (/قبلاً|already/i.test(error.message)) {
      state.lastDaily = today();
      saveLocalDisplayState();
    }
  } finally {
    render();
  }
}
window.claimDaily = claimDaily;

function openAd() {
  if (!AD_URL) {
    alert(language === "fa"
      ? "لینک تبلیغ هنوز تنظیم نشده است؛ فعلاً پاداش تبلیغاتی فعال نیست."
      : "The ad link is not configured. Ad rewards are not active yet.");
    return;
  }

  window.open(AD_URL, "_blank", "noopener,noreferrer");
}
window.openAd = openAd;

function getUserId() {
  return telegramUser?.id ? String(telegramUser.id) : "";
}

function setupReferral() {
  const id = getUserId();

  $("refLink").value = id
    ? `https://t.me/${BOT_USERNAME}?startapp=ref_${id}`
    : (language === "fa"
        ? "برای ساخت لینک اختصاصی، برنامه را از تلگرام باز کن."
        : "Open the app in Telegram to create your referral link.");
}

async function copyReferral() {
  const value = $("refLink").value;

  if (!getUserId()) {
    alert(language === "fa"
      ? "لینک اختصاصی هنوز آماده نیست."
      : "Your referral link is not ready yet.");
    return;
  }

  try {
    await navigator.clipboard.writeText(value);
    alert(language === "fa" ? "لینک دعوت کپی شد." : "Referral link copied.");
  } catch {
    $("refLink").focus();
    $("refLink").select();
    alert(language === "fa"
      ? "لینک را انتخاب کن و کپی کن."
      : "Select and copy the link.");
  }
}
window.copyReferral = copyReferral;

async function shareReferral() {
  const url = $("refLink").value;

  if (!getUserId()) {
    alert(language === "fa"
      ? "ابتدا برنامه را از تلگرام باز کن."
      : "Open the app in Telegram first.");
    return;
  }

  if (navigator.share) {
    try {
      await navigator.share({
        title: "NOT REWARD",
        text: language === "fa"
          ? "به NOT REWARD بپیوند!"
          : "Join NOT REWARD!",
        url
      });
    } catch {}
  } else {
    window.open(
      `https://t.me/share/url?url=${encodeURIComponent(url)}`,
      "_blank",
      "noopener,noreferrer"
    );
  }
}
window.shareReferral = shareReferral;

async function refreshReferrals() {
  try {
    const result = await apiRequest("/api/referrals", {});
    const count = Number(result.count ?? result.referralCount ?? 0);

    $("refCount").textContent = count;
    $("refReward").textContent = (count * 5).toFixed(2);

    alert(language === "fa"
      ? "اطلاعات دعوت از سرور دریافت شد."
      : "Referral information refreshed from the server.");
  } catch (error) {
    alert(error.message);
  }
}
window.refreshReferrals = refreshReferrals;

async function requestWithdrawal() {
  const amount = Number($("withdrawAmount").value);
  const address = connectedWallet?.account?.address;

  if (!serverReady) {
    alert(language === "fa"
      ? "موجودی سرور در دسترس نیست. ابتدا حساب را همگام‌سازی کن."
      : "Server balance is unavailable. Sync your account first.");
    return;
  }

  if (!getUserId()) {
    alert(language === "fa"
      ? "مینی‌اپ را از داخل تلگرام باز کن."
      : "Open the mini app inside Telegram.");
    return;
  }

  if (!address) {
    alert(language === "fa"
      ? "ابتدا کیف پول TON را متصل کن."
      : "Connect your TON wallet first.");
    return;
  }

  if (!Number.isFinite(amount) || amount < 300) {
    alert(language === "fa"
      ? "حداقل مبلغ برداشت 300 NOT است."
      : "Minimum withdrawal is 300 NOT.");
    return;
  }

  if (amount > state.balance) {
    alert(language === "fa"
      ? "موجودی تأییدشدهٔ سرور کافی نیست."
      : "Insufficient verified server balance.");
    return;
  }

  $("withdrawBtn").disabled = true;

  try {
    const result = await apiRequest("/api/withdraw", {
      amount,
      walletAddress: address
    });

    if (typeof result.balance === "number") {
      setBalance(result.balance);
    } else {
      await syncAccount();
    }

    $("withdrawAmount").value = "";
    alert(result.message || (language === "fa"
      ? "درخواست برداشت ثبت شد."
      : "Withdrawal request submitted."));
  } catch (error) {
    alert(error.message);
    await syncAccount();
  } finally {
    $("withdrawBtn").disabled = false;
  }
}
window.requestWithdrawal = requestWithdrawal;

function toggleLanguage() {
  language = language === "fa" ? "en" : "fa";
  document.documentElement.lang = language;
  document.documentElement.dir = language === "fa" ? "rtl" : "ltr";

  document.querySelectorAll("[data-fa]").forEach(el => {
    const value = el.getAttribute(`data-${language}`);
    if (value !== null) el.textContent = value;
  });

  $("tapMessage").textContent = language === "fa"
    ? "برای شروع، ربات را لمس کن"
    : "Tap the robot to start";

  render();
}
window.toggleLanguage = toggleLanguage;

async function start() {
  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();

    telegramUser = tg.initDataUnsafe?.user || null;
    $("tgName").textContent = telegramUser?.first_name || "کاربر تلگرام";
    $("tgId").textContent = telegramUser?.id || "در دسترس نیست";
  } else {
    $("tgName").textContent = "برای امکانات تلگرام، مینی‌اپ را از تلگرام باز کن";
  }

  setupReferral();

  if (window.TON_CONNECT_UI?.TonConnectUI) {
    try {
      walletUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: "https://mukefaceget15-web.github.io/adcoin-miniap/tonconnect-manifest.json",
        buttonRootId: "ton-connect"
      });

      walletUI.onStatusChange(wallet => {
        connectedWallet = wallet;

        const connected = Boolean(wallet?.account?.address);
        $("walletStatus").textContent = connected ? "متصل" : "متصل نیست";
        $("walletDot").classList.toggle("connected", connected);
        $("walletAddress").textContent =
          connected ? wallet.account.address : "—";
      });
    } catch (error) {
      console.error("TON Connect:", error);
      $("walletStatus").textContent = "خطا در اتصال";
    }
  } else {
    $("walletStatus").textContent = "TON Connect بارگذاری نشد";
  }

  render();
  await syncAccount();

  if (serverReady) {
    try {
      const result = await apiRequest("/api/referral", {});
      if (result.referralLink) $("refLink").value = result.referralLink;
      const count = Number(result.referralCount || 0);
      $("refCount").textContent = count;
      $("refReward").textContent = (count * 5).toFixed(2);
    } catch (error) {
      console.warn("Referral refresh:", error.message);
    }
  }
}

start();
})();
</script>
