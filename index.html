
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050a0e">
<title>NOT REWARD</title>
<style>
:root{--green:#00f59b;--bg:#050a0e;--panel:#0b131d;--muted:#9badc6}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 35%,#06251d 0%,#050a0e 55%);color:#fff;font-family:Arial,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer}
.app{max-width:520px;margin:auto;padding:20px 17px 100px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.mini-logo{width:45px;height:45px;border:2px solid var(--green);border-radius:15px;display:grid;place-items:center;background:#09251e;font-size:24px;box-shadow:0 0 20px #00f59b33}
.brand-name{font-size:19px;font-weight:900;letter-spacing:.3px}
.brand-name span{color:var(--green)}
.sub{font-size:11px;color:var(--muted);margin-top:4px}
.header-right{display:flex;align-items:center;gap:8px}
.online{font-size:11px;color:var(--green);white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);margin-right:4px}
.lang{border:1px solid #243447;background:#101a26;color:white;border-radius:20px;padding:9px 10px;font-size:12px}
.status{margin:24px 0 8px;text-align:center;font-size:11px;color:var(--muted);letter-spacing:2px}
.hero{text-align:center;padding-top:4px}
.orbit-wrap{height:290px;display:grid;place-items:center;position:relative}
.orbit{position:absolute;width:260px;height:260px;border-radius:50%;border:2px solid #00f59b25;box-shadow:0 0 45px #00f59b0b}
.orbit:before{content:"";position:absolute;inset:-3px;border-radius:50%;border:5px solid transparent;border-top-color:var(--green);border-left-color:#00f59b66;animation:spin 3s linear infinite;filter:drop-shadow(0 0 8px var(--green))}
.orbit:after{content:"";position:absolute;inset:17px;border-radius:50%;border:1px solid #00f59b48;animation:spin 6s linear infinite reverse}
.orbit2{position:absolute;width:220px;height:220px;border-radius:50%;border:1px dashed #00f59b66;animation:spin 12s linear infinite}
.robot{z-index:2;width:155px;height:145px;border-radius:43px;background:linear-gradient(145deg,#f7ffff,#8ea8bb 45%,#26394d 75%,#dcecff);padding:10px;box-shadow:0 0 35px #00f59b38;position:relative}
.robot:before{content:"";position:absolute;top:-17px;left:69px;width:12px;height:19px;background:#b9d3e4;border-radius:8px}
.robot:after{content:"";position:absolute;top:-27px;left:65px;width:20px;height:20px;border-radius:50%;background:var(--green);box-shadow:0 0 18px var(--green)}
.face{height:100%;border-radius:34px;background:linear-gradient(145deg,#091421,#02070c);display:flex;justify-content:center;align-items:center;gap:20px;border:2px solid #344c60}
.eye{width:28px;height:17px;border-top:7px solid var(--green);border-radius:50%;filter:drop-shadow(0 0 7px var(--green))}
.chest{position:absolute;bottom:-20px;left:48px;background:#10251f;border:2px solid var(--green);border-radius:50%;width:58px;height:38px;display:grid;place-items:center;color:var(--green);font-size:17px}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:35px;letter-spacing:-1px;margin:7px 0 4px}
h1 span{color:var(--green)}
.tagline{color:var(--muted);font-size:14px;margin-bottom:24px}
.start{width:100%;border:0;border-radius:18px;padding:17px;background:linear-gradient(100deg,#00bd78,#00f59b);font-weight:900;font-size:17px;color:#03130e;box-shadow:0 5px 28px #00f59b20}
.features{margin-top:27px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.feature{background:linear-gradient(145deg,#0e1926,#080f17);border:1px solid #1a2a3c;border-radius:17px;padding:19px 12px;text-align:center}
.feature-icon{font-size:25px;color:var(--green)}
.feature-title{font-weight:bold;margin-top:9px;font-size:14px}
.feature-desc{color:var(--muted);font-size:12px;margin-top:6px}
footer{position:fixed;bottom:0;left:0;right:0;background:#080f17f5;border-top:1px solid #1b2a3b;padding:12px max(16px,calc((100vw - 490px)/2));display:flex;justify-content:space-around;z-index:5}
.nav-item{background:none;border:0;color:#8fa3bd;font-size:11px;display:grid;gap:5px;justify-items:center}
.nav-item b{font-size:20px}
.nav-item.active{color:var(--green)}
[dir=rtl] .brand-name,[dir=rtl] .sub{direction:rtl}
@media(max-width:370px){.brand-name{font-size:16px}.orbit{width:235px;height:235px}.orbit2{width:200px;height:200px}.orbit-wrap{height:265px}.robot{transform:scale(.9)}h1{font-size:30px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="mini-logo" aria-label="NOT REWARD robot">🤖</div>
    <div>
      <div class="brand-name">NOT <span>REWARD</span></div>
      <div class="sub" id="subtitle">Play • Earn • Withdraw</div>
    </div>
  </div>
  <div class="header-right">
    <div class="online"><span class="dot"></span>ONLINE</div>
    <button class="lang" id="langBtn" onclick="toggleLang()">فارسی</button>
  </div>
</header>

<div class="status" id="status">WELCOME TO YOUR REWARD SPACE</div>
<section class="hero">
  <div class="orbit-wrap">
    <div class="orbit"></div><div class="orbit2"></div>
    <div class="robot">
      <div class="face"><div class="eye"></div><div class="eye"></div></div>
      <div class="chest">NR</div>
    </div>
  </div>
  <h1>NOT <span>REWARD</span></h1>
  <div class="tagline" id="tagline">Play • Earn • Withdraw</div>
  <button class="start" id="startBtn" onclick="startApp()">▶ &nbsp; START</button>
</section>

<section class="features">
  <div class="feature">
    <div class="feature-icon">◈</div>
    <div class="feature-title" id="earnTitle">Earn Points</div>
    <div class="feature-desc" id="earnDesc">Collect reward points</div>
  </div>
  <div class="feature">
    <div class="feature-icon">▣</div>
    <div class="feature-title" id="walletTitle">Wallet</div>
    <div class="feature-desc" id="walletDesc">Manage your balance</div>
  </div>
</section>
</div>

<footer>
  <button class="nav-item active" onclick="setTab(this,'home')"><b>⌂</b><span id="navHome">Home</span></button>
  <button class="nav-item" onclick="setTab(this,'earn')"><b>✧</b><span id="navEarn">Earn</span></button>
  <button class="nav-item" onclick="setTab(this,'wallet')"><b>▣</b><span id="navWallet">Wallet</span></button>
  <button class="nav-item" onclick="setTab(this,'profile')"><b>♙</b><span id="navProfile">Profile</span></button>
</footer>

<script>
let lang = 'en';

const translations = {
 en:{
  subtitle:'Play • Earn • Withdraw',status:'WELCOME TO YOUR REWARD SPACE',
  tagline:'Play • Earn • Withdraw',start:'▶  START',
  earnTitle:'Earn Points',earnDesc:'Collect reward points',
  walletTitle:'Wallet',walletDesc:'Manage your balance',
  home:'Home',earn:'Earn',wallet:'Wallet',profile:'Profile',
  alert:'Welcome to NOT REWARD!'
 },
 fa:{
  subtitle:'بازی • امتیاز • برداشت',status:'به دنیای پاداش خوش آمدید',
  tagline:'بازی کن • امتیاز بگیر • برداشت کن',start:'▶  شروع',
  earnTitle:'کسب امتیاز',earnDesc:'امتیاز جمع‌آوری کن',
  walletTitle:'کیف پول',walletDesc:'موجودی خود را مدیریت کن',
  home:'خانه',earn:'کسب امتیاز',wallet:'کیف پول',profile:'پروفایل',
  alert:'به NOT REWARD خوش آمدی!'
 }
};

function toggleLang(){
 lang = lang === 'en' ? 'fa' : 'en';
 const t = translations[lang];
 document.documentElement.lang = lang;
 document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
 document.getElementById('subtitle').textContent=t.subtitle;
 document.getElementById('status').textContent=t.status;
 document.getElementById('tagline').textContent=t.tagline;
 document.getElementById('startBtn').textContent=t.start;
 document.getElementById('earnTitle').textContent=t.earnTitle;
 document.getElementById('earnDesc').textContent=t.earnDesc;
 document.getElementById('walletTitle').textContent=t.walletTitle;
 document.getElementById('walletDesc').textContent=t.walletDesc;
 document.getElementById('navHome').textContent=t.home;
 document.getElementById('navEarn').textContent=t.earn;
 document.getElementById('navWallet').textContent=t.wallet;
 document.getElementById('navProfile').textContent=t.profile;
 document.getElementById('langBtn').textContent=lang==='en'?'فارسی':'English';
}

function startApp(){
 document.getElementById('status').textContent =
 lang==='fa'?'آماده‌ای!':'YOU ARE READY!';
}

function setTab(button,tab){
 document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
 button.classList.add('active');
}
</script>
</body>
</html>
