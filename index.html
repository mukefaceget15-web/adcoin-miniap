<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdCoin Mini App</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:Arial,sans-serif;background:#0d1424;color:#fff}
header{text-align:center;padding:20px 0}
h1{color:#65e6b3;margin-bottom:8px}
p{color:#aebbd0;line-height:1.8}
.card{max-width:420px;margin:16px auto;background:#19253a;border:1px solid #293952;border-radius:20px;padding:22px;text-align:center}
.balance{font-size:36px;font-weight:bold;color:#65e6b3}
button{width:100%;padding:15px;margin-top:12px;border:0;border-radius:12px;background:#65e6b3;color:#092116;font-size:16px;font-weight:bold}
button.secondary{background:#293952;color:white}
.note{font-size:12px;color:#8fa0b9}
</style>
</head>
<body>
<header>
<h1>🪙 AdCoin</h1>
<p>تماشا کن، امتیاز جمع کن</p>
</header>

<section class="card">
<p>موجودی امتیاز آزمایشی</p>
<div class="balance" id="balance">0</div>
<p class="note">این امتیازها فعلاً ارزش مالی ندارند.</p>
</section>

<section class="card">
<h3>📺 تبلیغات</h3>
<p>تبلیغات واقعی هنوز متصل نشده‌اند.</p>
<button onclick="alert('هنوز شبکه تبلیغاتی متصل نشده است.')">تماشای تبلیغ</button>
</section>

<section class="card">
<h3>👛 کیف پول TON</h3>
<p>در مرحله بعد اتصال واقعی کیف پول را اضافه می‌کنیم.</p>
<button class="secondary" onclick="alert('اتصال کیف پول هنوز فعال نیست.')">اتصال کیف پول</button>
</section>

<p class="note" style="text-align:center">نسخه آزمایشی AdCoin</p>
</body>
</html>
